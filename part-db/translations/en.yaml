configuration:
  default_lang:
    name: Default language
    description: Default UI language for new users (e.g. en, de, it, fr).
  default_timezone:
    name: Default timezone
    description: PHP timezone identifier, e.g. Europe/Rome or Europe/Berlin.
  base_currency:
    name: Base currency
    description: ISO 4217 code used as the reference currency for prices (e.g. EUR, USD).
  instance_name:
    name: Instance name
    description: Name shown in the navbar and page titles.
  allow_attachment_downloads:
    name: Allow attachment downloads
    description: Let Part-DB download attachment files from external URLs.
  max_attachment_file_size:
    name: Max attachment file size
    description: Upload limit for attachments, e.g. 100M.
  db_automigrate:
    name: Automatic database migration
    description: Run database migrations automatically on start (a backup is taken first).
  trusted_proxies:
    name: Trusted proxies
    description: Comma-separated proxy IP ranges. Keep the Home Assistant range if you reverse-proxy the app.
  trusted_hosts:
    name: Trusted hosts (optional)
    description: >-
      Regular expression of host names Part-DB may be reached under. Enter it
      unquoted, e.g. ^(192\.168\.1\.253|homeassistant\.local)$ . Leave empty to
      accept any host (a warning is shown in the UI in that case).
  database_url:
    name: External database URL (optional)
    description: >-
      Leave empty to use the built-in SQLite database (persisted on the app
      data volume). To use MySQL/MariaDB or PostgreSQL, provide a Doctrine DSN (Connection String),
      e.g. mysql://user:pass@host:3306/partdb?serverVersion=10.11.2-MariaDB
  env_vars:
    name: Environment Variables
    description: Add custom environment variables from Part-DB documentation to configure the app (e.g. MAILER_DSN for email settings).
