name: Part-DB
version: 2.14.0_7
slug: part_db
description: Part-DB electronic parts inventory, running the official partdborg/part-db image (https://github.com/Part-DB/Part-DB-server)
url: https://github.com/argaar/ha-part-db-app
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
host_network: false
hassio_api: false
map:
  - app_config:rw
ports:
  80/tcp: null
ports_description:
  80/tcp: Optional direct access. Leave empty to use Ingress only, or set a host port.
ingress: true
ingress_port: 80
panel_title: Part-DB
panel_icon: mdi:chip
options:
  default_lang: en
  default_timezone: Europe/Rome
  base_currency: EUR
  instance_name: Part-DB
  allow_attachment_downloads: false
  max_attachment_file_size: 100M
  db_automigrate: true
  trusted_proxies: 172.30.32.0/23,127.0.0.0/8,::1
  trusted_hosts: ""
  database_url: ""
  header_auth_enabled: false
  header_auth_header_name: REMOTE_USER
  header_auth_auto_create: true
  header_auth_disable_password_expiration: true
  header_auth_default_group: ""
schema:
  default_lang: str
  default_timezone: str
  base_currency: str
  instance_name: str
  allow_attachment_downloads: bool
  max_attachment_file_size: str
  db_automigrate: bool
  trusted_proxies: str
  trusted_hosts: str?
  database_url: str?
  header_auth_enabled: bool
  header_auth_header_name: str
  header_auth_auto_create: bool
  header_auth_disable_password_expiration: bool
  header_auth_default_group: str?
